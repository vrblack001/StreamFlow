[versions]
agp                 = "8.5.2"
kotlin              = "2.0.21"
ksp                 = "2.0.21-1.0.27"
coreKtx             = "1.13.1"
lifecycle           = "2.8.7"
activityCompose     = "1.9.3"
composeBom          = "2024.11.00"
navigation          = "2.8.4"
hilt                = "2.52"
hiltNavigationCompose = "1.2.0"
retrofit            = "2.11.0"
okhttp              = "4.12.0"
gson                = "2.11.0"
media3              = "1.4.1"
coil                = "2.7.0"
room                = "2.6.1"
datastore           = "1.1.1"
splashscreen        = "1.0.1"
workmanager         = "2.9.1"
# Third-party enhancements (SponsorBlock / RYD / DeArrow)
jsoup               = "1.18.3"
newpipe             = "v0.24.5"

[libraries]
# AndroidX core
androidx-core-ktx              = { group = "androidx.core",      name = "core-ktx",           version.ref = "coreKtx" }
androidx-lifecycle-runtime     = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel   = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose      = { group = "androidx.activity",  name = "activity-compose",   version.ref = "activityCompose" }
androidx-splashscreen          = { group = "androidx.core",      name = "core-splashscreen",  version.ref = "splashscreen" }

# Compose BOM
androidx-compose-bom           = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui                    = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics           = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling            = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview    = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3             = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons        = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation
androidx-navigation-compose    = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Hilt DI
hilt-android                   = { group = "com.google.dagger", name = "hilt-android",         version.ref = "hilt" }
hilt-compiler                  = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose        = { group = "androidx.hilt",     name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Network
retrofit                       = { group = "com.squareup.retrofit2", name = "retrofit",         version.ref = "retrofit" }
retrofit-gson                  = { group = "com.squareup.retrofit2", name = "converter-gson",   version.ref = "retrofit" }
okhttp                         = { group = "com.squareup.okhttp3",   name = "okhttp",           version.ref = "okhttp" }
okhttp-logging                 = { group = "com.squareup.okhttp3",   name = "logging-interceptor", version.ref = "okhttp" }
gson                           = { group = "com.google.code.gson",   name = "gson",             version.ref = "gson" }

# Media3 (ExoPlayer)
media3-exoplayer               = { group = "androidx.media3", name = "media3-exoplayer",       version.ref = "media3" }
media3-exoplayer-dash          = { group = "androidx.media3", name = "media3-exoplayer-dash",  version.ref = "media3" }
media3-exoplayer-hls           = { group = "androidx.media3", name = "media3-exoplayer-hls",   version.ref = "media3" }
media3-ui                      = { group = "androidx.media3", name = "media3-ui",              version.ref = "media3" }
media3-session                 = { group = "androidx.media3", name = "media3-session",         version.ref = "media3" }
media3-common                  = { group = "androidx.media3", name = "media3-common",          version.ref = "media3" }

# Image loading
coil-compose                   = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Room DB
room-runtime                   = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
room-ktx                       = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
room-compiler                  = { group = "androidx.room", name = "room-compiler",  version.ref = "room" }

# DataStore
datastore-preferences          = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# WorkManager
workmanager                    = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }

# Parsing
jsoup                          = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }

# NewPipeExtractor (via JitPack)
newpipe-extractor               = { group = "com.github.TeamNewPipe", name = "NewPipeExtractor", version.ref = "newpipe" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp", version.ref = "ksp" }
