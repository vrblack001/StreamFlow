name: Build & Release StreamFlow APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | sdkmanager --licenses || true

      - name: Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamFlow-v1.0-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "StreamFlow v1.0.0 (Initial Release)"
          body: |
            ## StreamFlow v1.0.0 🚀
            تطبيق يوتيوب متكامل ومبني على أفضل مزايا LibreTube و Flow مع دعم العربية وحل كافة المشاكل.

            ### المميزات:
            - دعم أندرويد 10 فما فوق ولجميع المعماريات (arm64, armeabi-v7a, x86, x86_64).
            - بدون خدمات جوجل أو تتبع (عبر Piped API).
            - SponsorBlock + Return YouTube Dislike + DeArrow مدمجة.
            - تشغيل في الخلفية وصورة داخل صورة (PiP).
            - واجهة عربية كاملة RTL وتصميم Material You.

            **حمل ملف الـ APK المرفق بالأسفل وثبته على هاتفك مباشرة.**
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
